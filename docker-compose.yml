services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sr
      POSTGRES_PASSWORD: sr
      POSTGRES_DB: standing_register
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sr -d standing_register"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sr:sr@db:5432/standing_register
      MODEL_BACKEND: ${MODEL_BACKEND:-fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WATCH_DIR: /srv/watched
      CORPUS_DIR: /srv/corpus
      RULES_DIR: /srv/rules
    ports:
      - "8000:8000"
    volumes:
      - .:/srv
      - watched:/srv/watched
    command: >
      sh -c "python -m app.cli init-db &&
             python -m app.cli seed &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app"

  watcher:
    build: .
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://sr:sr@db:5432/standing_register
      MODEL_BACKEND: ${MODEL_BACKEND:-fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WATCH_DIR: /srv/watched
      RULES_DIR: /srv/rules
    volumes:
      - .:/srv
      - watched:/srv/watched
    command: ["python", "-m", "app.cli", "watch"]

  web:
    image: node:22-alpine
    working_dir: /web
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  dbdata:
  watched:
